# Renick Carpentry — Netlify configuration
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Hide project/review templates on the live site. Set to "true" on a branch deploy to preview them.
  NEXT_PUBLIC_SHOW_TEMPLATES = "false"
  # Canonical origin — change if you choose www as canonical, and set the matching redirect below.
  NEXT_PUBLIC_SITE_URL = "https://renickcarpentary.com.au"

# Branch/preview deploys show templates and are not indexed.
[context.deploy-preview.environment]
  NEXT_PUBLIC_SHOW_TEMPLATES = "true"
[context.branch-deploy.environment]
  NEXT_PUBLIC_SHOW_TEMPLATES = "true"

# Canonical host: redirect www → apex (flip if you choose www).
[[redirects]]
  from = "https://www.renickcarpentary.com.au/*"
  to = "https://renickcarpentary.com.au/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
